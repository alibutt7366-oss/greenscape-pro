    <script>
      (function() {
        // Guard against browser extension interceptors failing on getter-only fetch property
        try {
          var origFetch = window.fetch ? window.fetch.bind(window) : undefined;
          var customFetch = origFetch;
          try {
            Object.defineProperty(window, 'fetch', {
              configurable: true,
              enumerable: true,
              get: function() { return customFetch; },
              set: function(fn) { customFetch = fn; }
            });
          } catch (_) {
            try {
              if (window.Window && Window.prototype) {
                Object.defineProperty(Window.prototype, 'fetch', {
                  configurable: true,
                  enumerable: true,
                  get: function() { return customFetch; },
                  set: function(fn) { customFetch = fn; }
                });
              }
            } catch (__) {}
          }
        } catch (_) {}

        // Prevent extension interceptor script errors from bubbling up to the window
        window.addEventListener('error', function(event) {
          if (
            (event && event.filename && event.filename.indexOf('chrome-extension://') !== -1) ||
            (event && event.message && event.message.indexOf('Cannot set property fetch of #<Window>') !== -1)
          ) {
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
            if (event.preventDefault) event.preventDefault();
            return true;
          }
        }, true);
      })();
    </script>
